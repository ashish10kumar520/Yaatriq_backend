
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE :Lax}   # Lax for local, None for production
        secure: ${SESSION_COOKIE_SECURE:false}       # false for local HTTP
        http-only: true
        path: /

spring:
  application:
    name: yaatriq-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/Yaatriq_db}
    username: ${DATABASE_USERNAME:ashishbehera}
    password: ${DATABASE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173/planner#sample-plan}
  google-redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yaatriq.ai,https://www.yaatriq.ai,http://localhost:5173}
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_AI_MODEL}
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
